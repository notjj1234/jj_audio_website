[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[client]
# Hide Deploy / rerun / clear-cache developer controls; keep the settings menu so
# testers can still switch light/dark theme.
toolbarMode = "viewer"

[server]
headless = true
address = "127.0.0.1"
fileWatcherType = "none"
runOnSave = false
# A 5-minute 44.1 kHz stereo WAV is already ~50 MB, and the uploader advertises
# WAV/FLAC, so a 50 MB cap rejected ordinary lossless input. Local-only app: the
# bytes never leave the machine, and run length is bounded by max_duration_sec.
maxUploadSize = 500
enableCORS = true
enableXsrfProtection = true
