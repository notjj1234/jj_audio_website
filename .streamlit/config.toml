[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[client]
# Hide Deploy / rerun / clear-cache developer controls; keep the settings menu so
# testers can still switch light/dark theme.
toolbarMode = "viewer"

[server]
headless = true
address = "127.0.0.1"
fileWatcherType = "none"
runOnSave = false
maxUploadSize = 50
enableCORS = true
enableXsrfProtection = true
allowedHosts = ["localhost", "127.0.0.1"]
