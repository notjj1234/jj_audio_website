[theme]
base = "dark"
primaryColor = "#f6ad49"
backgroundColor = "#192542"
secondaryBackgroundColor = "#2A4467"
textColor = "#f6ad49"

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[client]
# Print and Record screen are built into viewer mode. Minimal keeps About
# and drops those two. Appearance lives on the Settings page.
toolbarMode = "minimal"
[server]
headless = true
address = "127.0.0.1"
fileWatcherType = "none"
runOnSave = false
# A 5-minute 44.1 kHz stereo WAV is already ~50 MB, and the uploader advertises
# WAV/FLAC, so a 50 MB cap rejected ordinary lossless input. Local-only app: the
# bytes never leave the machine, and run length is bounded by max_duration_sec.
maxUploadSize = 500
enableCORS = true
enableXsrfProtection = true
