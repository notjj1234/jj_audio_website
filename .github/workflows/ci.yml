# Desktop-first test/lint gate (see docs/issues.md I-072).
# Runs on every push/PR:
#   - pytest across Linux, Windows, macOS (Intel runner)
#   - ruff lint over src/audio_to_tab (the engine shipped in the desktop build)
# Install profile mirrors `make install`: CPU torch + the Demucs extra. Tests
# mock torch/demucs availability, but a few integration tests (e.g.
# test_is_demucs_available) assert a real Demucs is installed, so the light
# `[dev]`-only profile is not enough — CPU wheels keep this ~3 min.
#
# macOS leg: basic-pitch excludes tensorflow on Darwin (no wheel), and its
# ICASSP model path imports tensorflow, so the hosted-backend job test
# (parked backend scope, tests/test_api.py::test_upload_and_job) is deselected
# on macOS only.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install CPU torch + app + dev deps
        run: |
          python -m pip install -U pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          python -m pip install -e ".[dev,demucs]"

      - name: Run tests
        if: runner.os != 'macOS'
        run: python -m pytest tests/ -q

      - name: Run tests (macOS, skip hosted-backend job test)
        if: runner.os == 'macOS'
        run: |
          python -m pytest tests/ -q \
            --deselect tests/test_api.py::test_upload_and_job

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff (pinned to match the dev venv)
        run: python -m pip install ruff==0.16.5

      - name: Lint engine
        run: ruff check src/audio_to_tab