[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-to-tab-pdf"
version = "0.1.3"
description = "Convert audio to guitar tab PDF using free/open-source tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "basic-pitch[onnx]>=0.3.0",
    "numpy>=1.24,<2",
    "setuptools>=68,<81",
    "pretty_midi>=0.2.10",
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "reportlab>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "yt-dlp>=2026.08",
    "streamlit>=1.55",
    "streamlit-local-storage>=0.0.25",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<4.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "boto3>=1.34",
    "slowapi>=0.1.9",
    "email-validator>=2.0",
]

[project.optional-dependencies]
demucs = ["demucs>=4.0", "torch>=2.2,<2.14", "torchaudio>=2.2,<2.12", "torchcodec>=0.14,<0.15"]
roformer = ["bs-roformer-infer>=0.1.5"]
separator = ["audio-separator>=0.39.1"]
scnet = ["torch>=2.2,<2.14"]
eval = ["mir_eval>=0.7", "scipy>=1.10"]
dev = ["pytest>=7.0", "ruff>=0.3", "httpx>=0.27"]
desktop = ["pyinstaller>=6", "pywebview>=6.2,<7"]

[project.scripts]
audio-transcribe = "audio_to_tab.cli.transcribe:main"
audio-mid2tab = "audio_to_tab.cli.mid2tab:main"
audio-tab2pdf = "audio_to_tab.cli.tab2pdf:main"
audio-pipeline = "audio_to_tab.cli.pipeline:main"
audio-isolate = "audio_to_tab.cli.isolate:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["audio_to_tab*", "backend*"]
exclude = ["tests*", "ui*", "web*", "eval*", "scripts*"]

[tool.pytest.ini_options]
markers = [
    "youtube: hits the public internet (skipped unless RUN_YOUTUBE_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PIE",
]
lint.ignore = [
    "E501",  # long lines are accepted project norm (line-length=100 is advisory)
    # Project style: resilient UI/tooling layers swallow errors and log loudly.
    "BLE001",
    "S110",
    "S112",
    # Deliberate typography in user-facing strings/docs: "0:32–1:15" time
    # ranges (pinned by tests), "2× slower" help text, "~−1 dBTP". Not typos.
    "RUF001",
    "RUF002",
    "RUF003",
]
