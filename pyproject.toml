[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-to-tab-pdf"
version = "1.0.0"
description = "Convert audio to guitar tab PDF using free/open-source tools"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "basic-pitch[onnx]>=0.3.0",
    "setuptools>=68,<81",
    "pretty_midi>=0.2.10",
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
    "reportlab>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "yt-dlp>=2024.1",
    "streamlit>=1.55",
    "streamlit-local-storage>=0.0.25",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<5.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "boto3>=1.34",
    "slowapi>=0.1.9",
    "email-validator>=2.0",
]

[project.optional-dependencies]
demucs = ["demucs>=4.0", "torch>=2.0", "torchaudio>=2.0", "torchcodec>=0.14,<0.15"]
eval = ["mir_eval>=0.7", "scipy>=1.10"]
dev = ["pytest>=7.0", "ruff>=0.3", "httpx>=0.27"]
desktop = ["pyinstaller>=6", "pywebview>=6.2,<7"]

[project.scripts]
audio-transcribe = "audio_to_tab.cli.transcribe:main"
audio-mid2tab = "audio_to_tab.cli.mid2tab:main"
audio-tab2pdf = "audio_to_tab.cli.tab2pdf:main"
audio-pipeline = "audio_to_tab.cli.pipeline:main"
audio-isolate = "audio_to_tab.cli.isolate:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["audio_to_tab*", "backend*"]
exclude = ["tests*", "ui*", "web*", "eval*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"
